name: release

# Tag a version (vX.Y.Z) to build the VSIX and attach it to a GitHub Release.
# This project is distributed via GitHub Releases only — it is NOT published to
# any extension marketplace.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out "vscode-claude-rtl-${GITHUB_REF_NAME#v}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
